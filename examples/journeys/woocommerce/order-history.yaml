schemaVersion: '1.0'
id: woo-order-history
name: Synthetic user order history
secrets: { username: OPENPREFLIGHT_WP_USERNAME, password: OPENPREFLIGHT_WP_PASSWORD }
steps:
  - loginAsWordPressUser: { usernameSecret: username, passwordSecret: password }
  - visit: { path: /my-account/orders/ }
  - expect: { target: { css: '.woocommerce-orders-table, .woocommerce-Message' }, state: visible }
