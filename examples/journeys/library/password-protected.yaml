schemaVersion: '1.0'
id: password-protected-page
name: Password-protected page
variables: { protectedPath: /protected/ }
secrets: { postPassword: OPENPREFLIGHT_POST_PASSWORD }
steps:
  - visit: { path: '${protectedPath}' }
  - fill: { target: { name: post_password }, secret: postPassword }
  - click: { target: { css: 'input[type=submit]' } }
