schemaVersion: '1.0'
id: mobile-navigation
name: Mobile navigation
steps:
  - visit: { path: / }
  - click: { target: { css: 'button[aria-controls], .menu-toggle' } }
  - expect: { target: { css: 'nav' }, state: visible }
  - press: { target: { css: 'button[aria-controls], .menu-toggle' }, key: Tab }
