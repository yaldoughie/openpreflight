name: Feature request
description: Propose a focused improvement within the project scope.
title: '[Feature]: '
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      { label: Problem, description: 'Who is affected and what cannot be done safely today?' }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior }
    validations: { required: true }
  - type: textarea
    id: security
    attributes: { label: Security, privacy, compatibility, and migration impact }
    validations: { required: true }
  - type: checkboxes
    id: data
    attributes:
      {
        label: Data safety,
        options:
          [
            {
              label: 'This request includes no credentials, production exports, or personal data.',
              required: true,
            },
          ],
      }
