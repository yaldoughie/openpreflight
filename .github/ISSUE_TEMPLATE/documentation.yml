name: Documentation issue
description: Report unclear, missing, or incorrect documentation.
title: '[Docs]: '
labels: [documentation]
body:
  - type: input
    id: page
    attributes: { label: Page or file }
    validations: { required: true }
  - type: textarea
    id: issue
    attributes: { label: What is unclear or wrong? }
    validations: { required: true }
  - type: textarea
    id: correction
    attributes: { label: Suggested correction }
