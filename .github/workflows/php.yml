name: PHP Agent
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@db91e1a0e48e84637d325a7ee4d2677e146ceec4 # 2.36.0
        with: { php-version: '8.1', coverage: none, tools: 'composer:v2' }
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer phpstan
      - run: find wordpress-plugin/openpreflight-agent -name '*.php' -print0 | xargs -0 -n1 php -l
  unit:
    runs-on: ubuntu-latest
    strategy:
      {
        fail-fast: false,
        matrix: { php: ['8.1', '8.2', '8.3', '8.4', '8.5'], wordpress: ['6.8', '7.0'] },
      }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@db91e1a0e48e84637d325a7ee4d2677e146ceec4 # 2.36.0
        with:
          {
            php-version: '${{ matrix.php }}',
            coverage: none,
            extensions: 'mysqli,zip',
            tools: 'composer:v2',
          }
      - run: composer install --no-interaction --prefer-dist
      - run: bash scripts/install-wp-tests.sh openpreflight_test root root 127.0.0.1 "${{ matrix.wordpress }}"
      - run: composer test
