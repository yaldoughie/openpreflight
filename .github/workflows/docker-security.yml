name: Docker security
on:
  pull_request: { paths: ['docker/**', 'docker-compose.yml', 'pnpm-lock.yaml'] }
  schedule: [{ cron: '41 4 * * 4' }]
permissions: { contents: read, security-events: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with: { context: ., file: docker/runner/Dockerfile, load: true, tags: 'openpreflight:scan' }
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0, post-2026 incident fixed release
        with:
          {
            image-ref: 'openpreflight:scan',
            format: sarif,
            output: trivy.sarif,
            severity: 'HIGH,CRITICAL',
            ignore-unfixed: true,
          }
      - uses: github/codeql-action/upload-sarif@7fc6561ed893d15cec696e062df840b21db27eb0 # v4.35.2
        with: { sarif_file: trivy.sarif }
