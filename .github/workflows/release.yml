name: Release
on: { push: { tags: ['v*.*.*'] } }
permissions: { contents: read }
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: write, packages: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, cache: pnpm }
      - uses: shivammathur/setup-php@db91e1a0e48e84637d325a7ee4d2677e146ceec4 # 2.36.0
        with: { php-version: '8.1', coverage: none, tools: 'composer:v2' }
      - run: test -z "$(grep -RIlE '[R]EPLACE_BEFORE_RELEASE|[R]EPLACE_WITH_' . --exclude-dir=.git)"
      - run: corepack enable && pnpm install --frozen-lockfile && composer install --no-interaction --prefer-dist
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && composer lint && composer phpstan && pnpm build && pnpm package
      - name: Select runner image tag
        run: echo "OPENPREFLIGHT_IMAGE=ghcr.io/yaldoughie/openpreflight:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: docker build -f docker/runner/Dockerfile -t "$OPENPREFLIGHT_IMAGE" .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          {
            image-ref: '${{ env.OPENPREFLIGHT_IMAGE }}',
            severity: 'HIGH,CRITICAL',
            exit-code: '1',
            ignore-unfixed: true,
          }
      - name: Authenticate to GitHub Container Registry
        env: { GHCR_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish runner image
        id: image
        run: |
          docker push "$OPENPREFLIGHT_IMAGE"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$OPENPREFLIGHT_IMAGE" | cut -d@ -f2)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: 'ghcr.io/yaldoughie/openpreflight'
          subject-digest: '${{ steps.image.outputs.digest }}'
          push-to-registry: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with: { subject-path: 'dist/release/*' }
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          { files: 'dist/release/*', generate_release_notes: true, fail_on_unmatched_files: true }
